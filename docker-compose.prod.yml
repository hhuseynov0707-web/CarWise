# Production overrides.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base file is a development environment: it mounts the source into the
# containers and runs both servers in watch mode, so a deployment that used it
# alone would be serving whatever happens to be on the host's disk through a
# reloader. This file replaces those parts and nothing else.
#
# What it does not do is expose Postgres or Redis. In development their ports
# are published so a psql or redis-cli on the host can reach them; on a public
# machine that is a database on the internet, so the port mappings are dropped
# and only the web and API ports remain.

services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-autointel}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    restart: unless-stopped

  redis:
    ports: !override []
    restart: unless-stopped

  api:
    # No source mount and no reloader: the image is the deployment.
    volumes: !override []
    # Reached through Caddy, not from the outside. Publishing it as well would
    # expose an origin that answers without TLS, which is the one thing the
    # proxy is there to prevent.
    ports: !override []
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --workers ${API_WORKERS:-2} --proxy-headers
             --forwarded-allow-ips '*'"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY — the app refuses to start without it}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the site's own origin}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Off by default here. Crawling from a deployed service is a different
      # act from crawling from a laptop, and it should be a decision rather
      # than something a deployment inherits.
      INGESTION_ENABLED: ${INGESTION_ENABLED:-false}
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Inlined into the client bundle at build time. Default it to a
        # relative path: Caddy serves the API under the site's own origin, so
        # the browser resolves this against whatever host it loaded the page
        # from, and the image is no longer built for one specific domain.
        # An absolute URL still works for an API on a separate host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    volumes: !override []
    ports: !override []
    environment:
      NODE_ENV: production
    restart: unless-stopped

  # Terminates TLS and puts the site and the API on one origin.
  #
  # Certificates are obtained and renewed automatically for whatever hostname
  # SITE_ADDRESS names, and are kept in a volume — losing it means re-issuing,
  # and Let's Encrypt rate-limits that, so the volume is not incidental.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS — the hostname to serve and obtain a certificate for}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  caddy_data:
  caddy_config:
